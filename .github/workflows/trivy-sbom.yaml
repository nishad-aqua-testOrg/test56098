name: Download and Execute Binary

on:
  workflow_dispatch:

jobs:
  download-and-execute:
    name: Download and Execute
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download binary

        run: |
          echo "Downloading binary..."
          wget --user=nishad.ali@aquasec.com --password=Ahyaan@786 https://download.aquasec.com/scanner/2607.3.5/scannercli

          echo "Binary downloaded successfully"

      - name: Verify downloaded file
        run: |
          set -euo pipefail

          ls -lh ./scannercli
          file ./scannercli

      - name: Make binary executable
        run: |
          chmod +x ./scannercli

      - name: Execute Scan
        env:
          XYZ_TOKEN: ${{ secrets.XYZ_DOWNLOAD_TOKEN }}
        run: |
          set -euo pipefail

          echo "Executing binary..."

          ./scannercli scan -A 858361df98fa12fdeba836450120c0dcb22c3c97694db7fbeae607150ee42e9a -H https://e11d515bfb.cloud.aquasec.com nginx --registry {registry}

          echo "Binary execution completed"